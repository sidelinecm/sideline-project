# ==============================================================================
# Netlify configuration for First Model Hub (SEO & Edge Optimized 2026)
# ==============================================================================
[build]
  publish = "."
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

# ==============================================================================
# 1. GLOBAL SECURITY & PERFORMANCE HEADERS
# ==============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=1800, s-maxage=3600, stale-while-revalidate=86400"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://esm.sh https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.clarity.ms https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: blob: https: https://zxetzqwjaiumqhrpumln.supabase.co https://res.cloudinary.com https://images.unsplash.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; frame-src 'self' https://www.google.com https://maps.google.com; connect-src 'self' https: wss: https://zxetzqwjaiumqhrpumln.supabase.co https://www.clarity.ms https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com;"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ==============================================================================
# 2. EDGE FUNCTIONS MAPPING
# ==============================================================================
# 🛡️ ลำดับที่ 1: ด่านตรวจคนเข้าเมือง (ต้องอยู่บนสุด เพื่อสกัดบอทขยะก่อนส่งต่อไปฟังก์ชันอื่น)


# 🟢 แผนผังเว็บไซต์
[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml"

# 🟢 ฟังก์ชันเรนเดอร์หน้ารายบุคคล
[[edge_functions]]
  function = "render-bot"
  path = "/sideline/*"

# 🟢 ฟังก์ชันเรนเดอร์หน้ารายจังหวัดและหน้าหลัก
[[edge_functions]]
  function = "ssr-province"
  path = "/location/*"

[[edge_functions]]
  function = "ssr-province"
  path = "/"

[[edge_functions]]
  function = "ssr-province"
  path = "/index.html"

[[edge_functions]]
  function = "ssr-province"
  path = "/.well-known/*"
  
# ==============================================================================
# 3. REDIRECTS (ฉบับสมบูรณ์ ปลอดภัย ไร้ Loop และดันคะแนน SEO สูงสุด)
# ==============================================================================

# 🟢 ลำดับที่ 1: ย้ายโดเมนเดิม sidelinechiangmai มา firstmodelhub แบบ 1:1
[[redirects]]
  from = "https://sidelinechiangmai.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sidelinechiangmai.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sidelinechiangmai.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.sidelinechiangmai.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

# 🟢 ลำดับที่ 2: รวมโดเมนสำรอง Netlify, www, และ Subdomain st. เข้าสู่โดเมนหลัก 1:1
[[redirects]]
  from = "https://firstmodelhub.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://firstmodelhub.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.firstmodelhub.com/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.firstmodelhub.com/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

# 🛡️ ดึง Subdomain st. กลับเข้าโดเมนหลักทั้งหมด (ป้องกัน Google Index หน้าซ้ำ)
[[redirects]]
  from = "https://st.firstmodelhub.com/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://st.firstmodelhub.com/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

# 🟢 ลำดับที่ 3: จัดการ Clean URLs พารามิเตอร์จังหวัด (?province=xxx -> /location/xxx)
[[redirects]]
  query = { province = ":p" }
  from = "/"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/location/*"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/profiles"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/profiles.html"
  to = "/location/:p"
  status = 301
  force = true

# 🟢 ลำดับที่ 4: แก้ไข URL ผิดปกติ และลบนามสกุล .html (301 Permanent Redirect)
[[redirects]]
  from = "/profiles.html"
  to = "/profiles"
  status = 301
  force = true

# ดักจับบั๊ก URL ที่มีเครื่องหมาย quote เกินมาใน Google Search Console
[[redirects]]
  from = "/profiles\"\""
  to = "/profiles"
  status = 301
  force = true

[[redirects]]
  from = "/profiles\"\"\""
  to = "/profiles"
  status = 301
  force = true

# 🟢 ลำดับที่ 5: จัดการหน้าภาษาอังกฤษ (/en เป็น URL สากล ไร้ปัญหา Loop 100%)
# ถ้ามีคนพิมพ์ /index-en หรือ /index-en.html ให้ 301 ดีดมาที่ /en
[[redirects]]
  from = "/index-en.html"
  to = "/en"
  status = 301
  force = true

[[redirects]]
  from = "/index-en"
  to = "/en"
  status = 301
  force = true

# ให้ /en ดึงเนื้อหาจากไฟล์ index-en.html มาแสดง (Rewrite 200 โดย URL บนเบราว์เซอร์ยังเป็น /en สวยงาม)
[[redirects]]
  from = "/en"
  to = "/index-en.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/index-en.html"
  status = 200

# 🟢 ลำดับที่ 6: SPA Fallback สำหรับระบบ Client-side Routing (ต้องอยู่ล่างสุดเสมอ)
[[redirects]]
  from = "/sideline/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/location/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200