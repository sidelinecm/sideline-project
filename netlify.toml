# ==============================================================================
# Netlify configuration for First Model Hub
# ==============================================================================
[build]
  publish = "."
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

# ==============================================================================
# 1. GLOBAL SECURITY & PERFORMANCE HEADERS (ปลดล็อก CSP ให้รองรับ esm.sh & jsdelivr)
# ==============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://esm.sh https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.clarity.ms https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: blob: https: https://zxetzqwjaiumqhrpumln.supabase.co https://res.cloudinary.com https://images.unsplash.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; frame-src 'self' https://www.google.com https://maps.google.com; connect-src 'self' https: wss: https://zxetzqwjaiumqhrpumln.supabase.co https://www.clarity.ms https://www.google-analytics.com;"

# Long cache for static assets
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ==============================================================================
# 2. EDGE FUNCTIONS
# ==============================================================================
[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml"

[[edge_functions]]
  function = "render-bot"
  path = "/sideline/*"

[[edge_functions]]
  function = "ssr-province"
  path = "/location/*"

[[edge_functions]]
  function = "ssr-province"
  path = "/"

[[edge_functions]]
  function = "ssr-province"
  path = "/index.html"

# ==============================================================================
# 3. REDIRECTS & REWRITES
# ==============================================================================
# ✅ ชี้ให้เข้า /profiles แล้ววิ่งไปเปิดไฟล์ profiles.html
[[redirects]]
  from = "/profiles"
  to = "/profiles.html"
  status = 200

# 301 Direct Redirects ไปยังโดเมนหลัก firstmodelhub.com
[[redirects]]
  from = "https://www.firstmodelhub.com/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://firstmodelhub.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://sidelinechiangmai.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sidelinechiangmai.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

# Normalize location query param -> clean path
[[redirects]]
  query = { province = ":p" }
  from = "/location/*"
  to = "/location/:p"
  status = 301
  force = true

# Dynamic Profile fallback
[[redirects]]
  from = "/sideline/*"
  to = "/index.html"
  status = 200