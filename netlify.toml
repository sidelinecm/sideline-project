# ==============================================================================
# Netlify configuration for First Model Hub
# ==============================================================================
[build]
  publish = "."
  edge_functions = "netlify/edge-functions"

[build.processing]
  skip_processing = false

# ==============================================================================
# 1. GLOBAL SECURITY & PERFORMANCE HEADERS
# ==============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=1800, s-maxage=3600, stale-while-revalidate=86400"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://esm.sh https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.clarity.ms https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: blob: https: https://zxetzqwjaiumqhrpumln.supabase.co https://res.cloudinary.com https://images.unsplash.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; frame-src 'self' https://www.google.com https://maps.google.com; connect-src 'self' https: wss: https://zxetzqwjaiumqhrpumln.supabase.co https://www.clarity.ms https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com;"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# ==============================================================================
# 2. EDGE FUNCTIONS MAPPING
# ==============================================================================

# 🛡️ ลำดับที่ 1: ดักจับโดเมนเก่าแล้วดีด 301
[[edge_functions]]
  function = "domain-redirect"
  path = "/*"

# 🟢 แผนผังเว็บไซต์
[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml"

# 🟢 ฟังก์ชันล้างแคชระดับ Edge สำหรับแอดมิน (เพิ่มใหม่)
[[edge_functions]]
  function = "ssr-province"
  path = "/api/*"

# 🟢 ฟังก์ชันเรนเดอร์หน้ารายบุคคล
[[edge_functions]]
  function = "render-bot"
  path = "/sideline/*"

# 🟢 ฟังก์ชันเรนเดอร์หน้ารายจังหวัดและโซนย่อย
[[edge_functions]]
  function = "ssr-province"
  path = "/location/*"

[[edge_functions]]
  function = "ssr-province"
  path = "/location/*/*"

[[edge_functions]]
  function = "ssr-province"
  path = "/province/*"

[[edge_functions]]
  function = "ssr-province"
  path = "/province/*/*"

# 🟢 เรนเดอร์หน้าแรก และหน้าหลัก
[[edge_functions]]
  function = "ssr-province"
  path = "/"

[[edge_functions]]
  function = "ssr-province"
  path = "/index.html"

# 🟢 เรนเดอร์หน้ารวมน้องๆ ทั้งหมด (เพิ่มใหม่)
[[edge_functions]]
  function = "ssr-province"
  path = "/profiles"

# 🟢 เรนเดอร์หน้าภาษาอังกฤษ
[[edge_functions]]
  function = "ssr-province"
  path = "/index-en"

[[edge_functions]]
  function = "ssr-province"
  path = "/.well-known/*"

# ==============================================================================
# 3. REDIRECTS & CLEAN URLS
# ==============================================================================

# 🟢 ย้ายหน้านิมมานเดิมไปยังโซนใหม่ ป้องกันหน้า 404 และรักษาอันดับ SEO (เพิ่มใหม่)
[[redirects]]
  from = "/nimman"
  to = "/location/chiangmai/nimman"
  status = 301
  force = true

[[redirects]]
  from = "/nimman.html"
  to = "/location/chiangmai/nimman"
  status = 301
  force = true

[[redirects]]
  from = "/niman"
  to = "/location/chiangmai/nimman"
  status = 301
  force = true

[[redirects]]
  from = "/niman.html"
  to = "/location/chiangmai/nimman"
  status = 301
  force = true

# 🟢 กรอง Query String จังหวัด
[[redirects]]
  query = { province = ":p" }
  from = "/"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/location/*"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/profiles"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/profiles.html"
  to = "/location/:p"
  status = 301
  force = true

# 🟢 บังคับตัดนามสกุล .html ทิ้งทั้งหมด (Canonical Clean URLs)
[[redirects]]
  from = "/profiles.html"
  to = "/profiles"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/faq.html"
  to = "/faq"
  status = 301
  force = true

[[redirects]]
  from = "/locations.html"
  to = "/locations"
  status = 301
  force = true

[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy-policy"
  status = 301
  force = true

[[redirects]]
  from = "/profiles\"\""
  to = "/profiles"
  status = 301
  force = true

[[redirects]]
  from = "/profiles\"\"\""
  to = "/profiles"
  status = 301
  force = true

# 🟢 รวม URL ภาษาอังกฤษเข้า /index-en
[[redirects]]
  from = "/index-en.html"
  to = "/index-en"
  status = 301
  force = true

[[redirects]]
  from = "/en"
  to = "/index-en"
  status = 301
  force = true

[[redirects]]
  from = "/index-en"
  to = "/index-en.html"
  status = 200

# 🟢 Fallback Routes สำหรับ Client-Side Routing
[[redirects]]
  from = "/sideline/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/location/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200