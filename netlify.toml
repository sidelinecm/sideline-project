# ==============================================================================
# Netlify configuration for First Model Hub (SEO & Edge Optimized 2026)
# ==============================================================================
[build]
  publish = "."
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

# ==============================================================================
# 1. GLOBAL SECURITY & PERFORMANCE HEADERS
# ==============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # 🟢 SAMEORIGIN เพื่อให้ Google Search Console / Rich Results Test สแกนและถ่ายภาพผ่าน 100%
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=1800, s-maxage=3600, stale-while-revalidate=86400"
    # 🟢 CSP ครอบคลุม Supabase, Cloudinary, Google Analytics, GTM, และ FontAwesome
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://esm.sh https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.clarity.ms https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: blob: https: https://zxetzqwjaiumqhrpumln.supabase.co https://res.cloudinary.com https://images.unsplash.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; frame-src 'self' https://www.google.com https://maps.google.com; connect-src 'self' https: wss: https://zxetzqwjaiumqhrpumln.supabase.co https://www.clarity.ms https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com;"

# 🟢 ตั้งค่าแคช CSS และ JS
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Long cache for media images & fonts
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ==============================================================================
# 2. EDGE FUNCTIONS MAPPING (🟢 FIX: ชี้เข้าหาไฟล์ ssr.js ให้ถูกต้องตรงกัน)
# ==============================================================================

[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml"

[[edge_functions]]
  function = "ssr"
  path = "/sideline/*"

[[edge_functions]]
  function = "ssr"
  path = "/location/*"

[[edge_functions]]
  function = "ssr"
  path = "/"

[[edge_functions]]
  function = "ssr"
  path = "/index.html"

[[edge_functions]]
  function = "ssr"
  path = "/profiles"

# ==============================================================================
# 3. REDIRECTS & REWRITES
# ==============================================================================
# 🎯 301 Direct Redirects รักษาพลัง SEO จากโดเมนเดิมและซับโดเมนทั้งหมด
[[redirects]]
  from = "https://sidelinechiangmai.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sidelinechiangmai.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.firstmodelhub.com/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://firstmodelhub.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

# 🟢 เปลี่ยน Query Parameter ของหน้าแรกเข้าหน้าจังหวัดแบบ Clean Path
[[redirects]]
  query = { province = ":p" }
  from = "/"
  to = "/location/:p"
  status = 301
  force = true

# Normalize location query param -> clean path
[[redirects]]
  query = { province = ":p" }
  from = "/location/*"
  to = "/location/:p"
  status = 301
  force = true

# Dynamic Profile & Location Fallback (SPA Single Page Application Rewrites)
[[redirects]]
  from = "/sideline/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/location/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200