# ==============================================================================
# Netlify configuration for First Model Hub
# ==============================================================================
[build]
  publish = "."
  edge_functions = "netlify/edge-functions"

[build.processing]
  skip_processing = false

# ==============================================================================
# 1. GLOBAL SECURITY & PERFORMANCE HEADERS
# ==============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=1800, s-maxage=3600, stale-while-revalidate=86400"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://esm.sh https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.clarity.ms https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: blob: https: https://zxetzqwjaiumqhrpumln.supabase.co https://res.cloudinary.com https://images.unsplash.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; frame-src 'self' https://www.google.com https://maps.google.com; connect-src 'self' https: wss: https://zxetzqwjaiumqhrpumln.supabase.co https://www.clarity.ms https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com;"

[[headers]]
  for = "/ai-catalog.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# ==============================================================================
# 2. EDGE FUNCTIONS MAPPING
# ==============================================================================

# 🛡️ ลำดับที่ 1: ดักจับโดเมนเก่าแล้วดีด 301
[[edge_functions]]
  function = "domain-redirect"
  path = "/*"

# 🟢 แผนผังเว็บไซต์
[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml"

# 🟢 ฟังก์ชันล้างแคชระดับ Edge สำหรับแอดมิน
[[edge_functions]]
  function = "ssr-province"
  path = "/api/*"

# 🟢 ฟังก์ชันเรนเดอร์หน้ารายบุคคล
[[edge_functions]]
  function = "render-bot"
  path = "/sideline/*"

# 🟢 ฟังก์ชันเรนเดอร์หน้ารายจังหวัดและโซนย่อย (ตัด /province/* ออก เพื่อไม่ให้สร้างหน้าซ้ำ)
[[edge_functions]]
  function = "ssr-province"
  path = "/location/*"

[[edge_functions]]
  function = "ssr-province"
  path = "/location/*/*"

# 🟢 เรนเดอร์หน้าแรก และหน้าหลัก
[[edge_functions]]
  function = "ssr-province"
  path = "/"

[[edge_functions]]
  function = "ssr-province"
  path = "/index.html"

# 🟢 เรนเดอร์หน้ารวมน้องๆ ทั้งหมด
[[edge_functions]]
  function = "ssr-province"
  path = "/profiles"

# 🟢 เรนเดอร์หน้าภาษาอังกฤษ
[[edge_functions]]
  function = "ssr-province"
  path = "/index-en"

# ==============================================================================
# 3. REDIRECTS & CLEAN URLS
# ==============================================================================

# 🟢 เชื่อมต่อคำขอ AI Agent ทุกเส้นทางตรงเข้า ai-catalog.json
[[redirects]]
  from = "/.well-known/ai-catalog.json"
  to = "/ai-catalog.json"
  status = 200

[[redirects]]
  from = "/.well-known/ard.json"
  to = "/ai-catalog.json"
  status = 200

# 🟢 รวม /province/* ทั้งหมดมาที่ /location/* (แก้สร้างหน้าซ้ำ 2 ชุด)
[[redirects]]
  from = "/province/*"
  to = "/location/:splat"
  status = 301
  force = true

# 🟢 ย้ายหน้านิมมานเดิมไปยังโซนใหม่ ป้องกันหน้า 404 และรักษาอันดับ SEO สูงสุด
[[redirects]]
  from = "/nimman"
  to = "/location/chiangmai/nimman"
  status = 301
  force = true

[[redirects]]
  from = "/nimman.html"
  to = "/location/chiangmai/nimman"
  status = 301
  force = true

[[redirects]]
  from = "/niman"
  to = "/location/chiangmai/nimman"
  status = 301
  force = true

[[redirects]]
  from = "/niman.html"
  to = "/location/chiangmai/nimman"
  status = 301
  force = true

# 🟢 รวม URL ชื่อจังหวัดเก่า/สะกดต่างกันเข้า URL มาตรฐาน
[[redirects]]
  from = "/location/khonkaen"
  to = "/location/khon-kaen"
  status = 301
  force = true

[[redirects]]
  from = "/location/khonkaen/*"
  to = "/location/khon-kaen/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/location/chiang-mai"
  to = "/location/chiangmai"
  status = 301
  force = true

[[redirects]]
  from = "/location/chiang-mai/*"
  to = "/location/chiangmai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/location/chiang_mai"
  to = "/location/chiangmai"
  status = 301
  force = true

[[redirects]]
  from = "/location/chiang_mai/*"
  to = "/location/chiangmai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/location/phra-nakhon-si-ayutthaya"
  to = "/location/ayutthaya"
  status = 301
  force = true

[[redirects]]
  from = "/location/surat-thani"
  to = "/location/suratthani"
  status = 301
  force = true

[[redirects]]
  from = "/location/nakhon-ratchasima"
  to = "/location/korat"
  status = 301
  force = true

[[redirects]]
  from = "/location/hat-yai"
  to = "/location/songkhla"
  status = 301
  force = true

# 🟢 กรอง Query String จังหวัด
[[redirects]]
  query = { province = ":p" }
  from = "/"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/location/*"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/profiles"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/profiles.html"
  to = "/location/:p"
  status = 301
  force = true

# 🟢 บังคับตัดนามสกุล .html ทิ้งทั้งหมด (Canonical Clean URLs)
[[redirects]]
  from = "/profiles.html"
  to = "/profiles"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/faq.html"
  to = "/faq"
  status = 301
  force = true

[[redirects]]
  from = "/locations.html"
  to = "/locations"
  status = 301
  force = true

[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy-policy"
  status = 301
  force = true

# 🟢 แก้บั๊ก URL ติดเครื่องหมายคำพูดจาก GSC
[[redirects]]
  from = "/profiles\""
  to = "/profiles"
  status = 301
  force = true

[[redirects]]
  from = "/profiles\"\""
  to = "/profiles"
  status = 301
  force = true

[[redirects]]
  from = "/profiles\"\"\""
  to = "/profiles"
  status = 301
  force = true

[[redirects]]
  from = "/profiles%22%22"
  to = "/profiles"
  status = 301
  force = true

[[redirects]]
  from = "/profiles%22%22%22"
  to = "/profiles"
  status = 301
  force = true

# 🟢 ส่งบทความเก่าที่ลบแล้วไปหน้ารวมบทความ (แก้ Soft 404 กลายเป็นหน้าแรก)
[[redirects]]
  from = "/blog/what-is-gfe-fiwfan-guide"
  to = "/blog"
  status = 301
  force = true

# 🟢 รวม URL ภาษาอังกฤษเข้า /index-en (เอา 301 force จาก /index-en.html ออก เพื่อไม่ให้ขวาง getTemplateHtml; ส่วน /index-en.html -> /index-en จะดัก 301 ใน ssr-province.js)
[[redirects]]
  from = "/en"
  to = "/index-en"
  status = 301
  force = true

[[redirects]]
  from = "/index-en"
  to = "/index-en.html"
  status = 200

# 🟢 Fallback 404 จริง (ปิดการเสิร์ฟหน้าแรก 200 OK ซ้ำซ้อนบน URL ที่ไม่มีอยู่จริง)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404