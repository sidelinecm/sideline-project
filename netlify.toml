# ==============================================================================
# Netlify configuration for First Model Hub (SEO & Edge Optimized 2026)
# ==============================================================================
[build]
  publish = "."
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

# ==============================================================================
# 1. GLOBAL SECURITY & PERFORMANCE HEADERS
# ==============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=1800, s-maxage=3600, stale-while-revalidate=86400"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://esm.sh https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.clarity.ms https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: blob: https: https://zxetzqwjaiumqhrpumln.supabase.co https://res.cloudinary.com https://images.unsplash.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; frame-src 'self' https://www.google.com https://maps.google.com; connect-src 'self' https: wss: https://zxetzqwjaiumqhrpumln.supabase.co https://www.clarity.ms https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com;"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ==============================================================================
# 2. EDGE FUNCTIONS MAPPING (✅ แก้ไขจุดนี้ให้ครอบคลุม 100% ไม่หลุดขบวน)
# ==============================================================================

[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml"

# ให้ render-bot ดูแลเฉพาะหน้าโปรไฟล์เดี่ยวสำหรับบอท
[[edge_functions]]
  function = "render-bot"
  path = "/sideline/*"

# ✅ ให้ ssr-province ดูแลเส้นทางทั้งหมด (หน้าแรก, หน้ารายจังหวัด) รวบจบในบรรทัดเดียว
[[edge_functions]]
  function = "ssr-province"
  path = "/*"

# ==============================================================================
# 3. REDIRECTS & REWRITES
# ==============================================================================
[[redirects]]
  from = "https://sidelinechiangmai.netlify.app/*"
  to = "https://firstmodelhub.com/location/chiangmai"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sidelinechiangmai.netlify.app/*"
  to = "https://firstmodelhub.com/location/chiangmai"
  status = 301
  force = true

[[redirects]]
  from = "https://www.firstmodelhub.com/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://firstmodelhub.netlify.app/*"
  to = "https://firstmodelhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/location/*"
  to = "/location/:p"
  status = 301
  force = true

# ✅ SPA Fallback: กำหนด force = false เพื่อให้ Edge Function ทำงานก่อนเสมอ
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false