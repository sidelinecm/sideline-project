# ==============================================================================
# Netlify configuration for First Model Hub
# ==============================================================================
[build]
  publish = "."
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

# ==============================================================================
# 1. GLOBAL SECURITY & PERFORMANCE HEADERS
# ==============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cache-Control = "public, max-age=1800, s-maxage=3600, stale-while-revalidate=86400"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://esm.sh https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.clarity.ms https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: blob: https: https://zxetzqwjaiumqhrpumln.supabase.co https://res.cloudinary.com https://images.unsplash.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; frame-src 'self' https://www.google.com https://maps.google.com; connect-src 'self' https: wss: https://zxetzqwjaiumqhrpumln.supabase.co https://www.clarity.ms https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com;"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ==============================================================================
# 2. EDGE FUNCTIONS MAPPING
# ==============================================================================

# 🛡️ ลำดับที่ 1 ด่านหน้าสุด: สกัดโดเมนเก่าแล้วดีด 301 ทันที
[[edge_functions]]
  function = "domain-redirect"
  path = "/*"

# 🟢 แผนผังเว็บไซต์
[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml"

# 🟢 ฟังก์ชันเรนเดอร์หน้ารายบุคคล
[[edge_functions]]
  function = "render-bot"
  path = "/sideline/*"

# 🟢 ฟังก์ชันเรนเดอร์หน้ารายจังหวัดและหน้าหลัก
[[edge_functions]]
  function = "ssr-province"
  path = "/location/*"

[[edge_functions]]
  function = "ssr-province"
  path = "/"

[[edge_functions]]
  function = "ssr-province"
  path = "/index.html"

[[edge_functions]]
  function = "ssr-province"
  path = "/.well-known/*"
  
# ==============================================================================
# 3. REDIRECTS & CLEAN URLS
# ==============================================================================
[[redirects]]
  query = { province = ":p" }
  from = "/"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/location/*"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/profiles"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  query = { province = ":p" }
  from = "/profiles.html"
  to = "/location/:p"
  status = 301
  force = true

[[redirects]]
  from = "/profiles.html"
  to = "/profiles"
  status = 301
  force = true

[[redirects]]
  from = "/profiles\"\""
  to = "/profiles"
  status = 301
  force = true

[[redirects]]
  from = "/profiles\"\"\""
  to = "/profiles"
  status = 301
  force = true

[[redirects]]
  from = "/index-en.html"
  to = "/en"
  status = 301
  force = true

[[redirects]]
  from = "/index-en"
  to = "/en"
  status = 301
  force = true

[[redirects]]
  from = "/en"
  to = "/index-en.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/index-en.html"
  status = 200

[[redirects]]
  from = "/sideline/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/location/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200